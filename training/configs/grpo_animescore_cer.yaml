# GRPO with AnimeScore + CER-zone reward (Llasa-1B-Multilingual, JP).
# Selected checkpoint reported in paper: step 1400.
#
# This config records hyperparameters sufficient to reproduce the policy
# update. The training launcher itself is not included in this release
# (we use verl/PPO scaffolding); a reviewer can wire this YAML into any
# GRPO/PPO trainer that supports a custom reward function.

base_model: HKUSTAudio/Llasa-1B-Multilingual
reward_axis: animescore_cer       # see reward_functions/animescore_cer.py
selected_step: 1400

cer_zone:
  tau_low: 0.10
  tau_high: 0.30
  rho: 1.0
  bonus_clean: 0.5

decoding:
  do_sample: true
  temperature: 1.0
  top_p: 0.85
  repetition_penalty: 1.05
  max_response_length: 2048

rollout:
  n: 4                            # K=4 rollouts per prompt
  speech_token_start_id: 128264
  speech_token_end_id:   193799
  stop_token_ids: [128261]

optim:
  lr: 5.0e-7
  ppo_mini_batch_size: 16
  ppo_micro_batch_size_per_gpu: 4
  clip_ratio: 0.1
  entropy_coeff: 0.0

kl:
  kl_in_reward: true
  adaptive: true
  init_coef: 0.05
  target_kl: 0.05
  horizon: 2000

data:
  train: prompts/jp_train_prompts.csv     # 900 prompts
  val:   prompts/jp_val_prompts.csv       # 100 prompts (val_kwargs.do_sample = true)

trainer:
  test_freq: 30
  save_freq: 30
  total_epochs: 40
